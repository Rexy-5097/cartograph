# The documentation site (M17).
#
# Every pull request builds the VitePress site from docs/ and checks its links
# and anchors, so a change that breaks the site fails review rather than the
# deploy. A push to main also publishes the build to GitHub Pages.
#
# Deploying needs the repository's Pages source set to "GitHub Actions"
# (Settings → Pages). Until it is, pull requests are unaffected, but a run on
# main fails at "Configure Pages".
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Publish only from main; a pull request or a dispatch on another branch
  # builds and checks the site without deploying it.
  DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
  # Pages serves the site at the root of its custom domain, cartograph.co.in,
  # so it is built for "/" rather than the default "/cartograph/". The link
  # check reads the same variable (docs/.vitepress/site-base.mjs). The domain
  # itself is set in Settings → Pages, not in a CNAME file: a workflow-built
  # site takes it from there.
  CARTOGRAPH_SITE_BASE: "/"

jobs:
  build:
    name: build · check links
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      # VitePress fails the build on a link to a page that does not exist, and
      # the site config fails it on a link to a repository file that does not.
      - name: Build the site
        run: npm run build

      - name: Check links and anchors
        run: npm run check-links

      - name: Configure Pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@v4

      - name: Upload the site
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; a newer push waits rather than cancelling one in
    # progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
