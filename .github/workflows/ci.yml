# Cartograph CI.
#
# Runs exactly what `make check` and `make gates` run locally, so a green local
# run and a green CI run cannot disagree. Both use the toolchain pinned in
# rust-toolchain.toml, which is what makes that guarantee real rather than
# aspirational. Linux is the primary target for speed; from M09 the release
# binary is also built and smoke-tested on Linux and macOS on every pull
# request, so a platform cannot break between tags.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

permissions:
  contents: read

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rustup show` installs and selects exactly the toolchain pinned in
      # rust-toolchain.toml. Installing `stable` here instead is what let CI
      # and local machines drift apart by eight minor versions.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Record toolchain
        run: rustc --version && cargo clippy --version && cargo fmt --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Formatting (QG-002)
        run: cargo fmt --all -- --check

      - name: Clippy, warnings denied (QG-003)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests (QG-004)
        run: cargo test --workspace

      - name: Benchmarks compile
        run: cargo bench --workspace --no-run

  gates:
    name: quality gates QG-001…009
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rustup show` installs and selects exactly the toolchain pinned in
      # rust-toolchain.toml. Installing `stable` here instead is what let CI
      # and local machines drift apart by eight minor versions.
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Record toolchain
        run: rustc --version && cargo clippy --version && cargo fmt --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-gates-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-gates-${{ runner.os }}-

      - name: Run gates
        run: python3 agentos/tools/scripts/run_gates.py

  agentos:
    name: AgentOS validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install --quiet PyYAML
      - name: Validate framework health
        run: python3 agentos/tools/scripts/validate_agentos.py

  release-build:
    name: release binary · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      # M09 ships a binary. Testing only the debug build would mean the
      # artefact users actually run is the one nothing exercises.
      - name: Build release binary
        run: cargo build --release -p cartograph-cli

      - name: Smoke test the release binary
        shell: bash
        run: |
          BIN=target/release/cartograph
          FIXTURES=crates/cartograph-parser/tests/fixtures

          "$BIN" version | grep -q "cartograph 0.1.0"
          # Derived from the ledger, not pinned. A literal here is invisible
          # to cargo and to the gates, so it fails in CI a milestone late.
          MILESTONE=$(grep '^current_milestone:' agentos/artifacts/project-state.yaml | awk '{print $2}')
          "$BIN" version | grep -q "milestone $MILESTONE"

          "$BIN" "$FIXTURES" | grep -q "Nothing above is claimed to be verified"
          # Derived from the constant, not pinned. A literal here is outside
          # the workspace, so cargo and the gates cannot see it and it fails
          # in CI one milestone late.
          SCHEMA=$(grep -oE 'SCHEMA_VERSION: &str = "[^"]+"' crates/cartograph-cli/src/json.rs | grep -oE '"[^"]+"' | tr -d '"')
          "$BIN" --json "$FIXTURES" | SCHEMA="$SCHEMA" python3 -c "import json,os,sys; d=json.load(sys.stdin); assert d['schema_version']==os.environ['SCHEMA'], d['schema_version']; assert d['summary']['files']>0"
          "$BIN" trace http.ts --path "$FIXTURES" | grep -q "HTTP-CALL"

          # Exit codes are a documented contract (docs/development/cli.md).
          set +e
          "$BIN" trace NoSuchSymbol --path "$FIXTURES" >/dev/null 2>&1; test $? -eq 5 || { echo "expected 5"; exit 1; }
          "$BIN" no/such/path                         >/dev/null 2>&1; test $? -eq 3 || { echo "expected 3"; exit 1; }
          "$BIN" --definitely-not-a-flag              >/dev/null 2>&1; test $? -eq 2 || { echo "expected 2"; exit 1; }
          set -e

          # A closed pipe is not a crash.
          "$BIN" "$FIXTURES" 2>/dev/null | head -2 >/dev/null
          echo "release binary verified on ${{ matrix.os }}"

  npm-wrapper:
    name: npm wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build the engine the wrapper launches
        run: cargo build --release -p cartograph-cli
      # The wrapper is a launcher. Its whole contract is that it finds the
      # right binary and forwards argv, stdio and the exit code unchanged.
      - name: Test the wrapper
        working-directory: npm
        env:
          CARTOGRAPH_BINARY: ${{ github.workspace }}/target/release/cartograph
        run: node test.js

  # M14's review-comment helper. It is plain Node with no dependencies, like
  # the npm wrapper, so it needs no install step — and a workflow with no
  # lockfile cannot have one poisoned. The GitHub API is stubbed at `fetch`,
  # which is the boundary the helper owns; whether the Action actually runs on
  # a pull request is established on a real pull request, not here.
  action-scripts:
    name: action scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test the review-comment upsert
        working-directory: .github/scripts
        run: node review-comment.test.js

  # MAP's desktop shell (M11). It is a separate cargo workspace on purpose —
  # `tauri` links a system webview, and the jobs above have never needed GUI
  # libraries — so it gets its own job that installs what it needs rather than
  # imposing that cost on every other job. See ADR-0016.
  desktop:
    name: desktop shell · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install pinned Rust toolchain
        run: rustup show

      # Tauri v2's Linux prerequisites. macOS builds against the system
      # WebKit and needs none of this.
      - name: Install webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-desktop-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-desktop-${{ runner.os }}-

      # `npm ci` rather than `npm install`: the lockfile is the contract, and a
      # job that silently resolves different versions is not testing what ships.
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Type-check the frontend
        working-directory: desktop
        run: npm run typecheck

      # `generate_context!` reads ../dist, so the frontend must be built before
      # the Rust side will compile at all.
      - name: Build the frontend
        working-directory: desktop
        run: npx vite build

      # The reducer is the one piece of frontend logic that can be wrong, and
      # tsc is happy with a state machine that returns the wrong state.
      # The renderer benchmark is development-only, and the guard that makes it
      # so is a `import.meta.env.DEV` block wrapping the dynamic import. That is
      # easy to weaken by accident — guarding only the JSX still emits the
      # chunk — so the property is asserted rather than trusted.
      - name: The dev-only benchmark must not reach the bundle
        working-directory: desktop
        run: |
          if ls dist/assets/ | grep -i benchmark; then
            echo "The benchmark was bundled into a production build."
            exit 1
          fi
          echo "No benchmark chunk in dist/ — as intended."

      - name: Test the frontend
        working-directory: desktop
        run: npm test

      - name: Clippy the Tauri shell, warnings denied
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # `cargo build`, not `cargo check`. Checking type-checks and expands the
      # macros — which is where a bad icon surfaces — but it never links, so it
      # cannot support the claim that the shell builds. The dependencies are
      # already compiled by the clippy step above, so this costs the link and
      # little else.
      - name: Build the shell
        working-directory: desktop/src-tauri
        run: cargo build
