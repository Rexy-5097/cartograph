# Cartograph's architecture review on its own pull requests.
#
# M14's Action runs the binary in the user's own CI and posts what it returns.
# ROADMAP.md states that shape and the reason for it: "Runs the binary in the
# user's own CI — no server, no hosting cost … Running analysis in the user's
# CI rather than on hosted infrastructure holds operating cost at zero through
# launch. Do not undo that without a reason." So there is no service here, no
# backend, and no analysis logic in YAML — the workflow obtains two trees, runs
# `cartograph diff --markdown`, and hands the result to a comment upsert.
#
# ## Why `pull_request_target`, and why that is safe here
#
# A contributor pull request comes from a fork. On `pull_request`, GitHub gives
# a fork's workflow a read-only token, so `pull-requests: write` cannot be
# granted and the comment would fail with 403. `pull_request_target` runs in the
# base repository's context with a writable token, which is what makes the
# milestone's own acceptance — "Action runs on Cartograph's own PRs" — possible
# for a fork contribution at all.
#
# `pull_request_target` is dangerous when a workflow *executes* code from the
# pull request. This one does not, and the separation is deliberate:
#
#   * The binary is built from the **base** commit. `cargo build` runs
#     `crates/cartograph-cli/build.rs`, and that is the only build script in the
#     workspace — building from the head would execute a contributor's code.
#     The base checkout is the one this workflow builds, always.
#   * The head arrives **as an archive, not a checkout**, unpacked into a
#     directory outside the cargo workspace. `actions/checkout` refuses a
#     fork's head under `pull_request_target` unless `allow-unsafe-pr-checkout:
#     true` is set, because a checkout in this context is how "pwn request"
#     bugs happen. Opting in would work here -- this workflow never runs what
#     it fetches -- but an archive is better than an opt-out: it arrives with
#     no `.git`, no remote and no stored credential, so "the head is data" is
#     true of the filesystem and not only of our intentions.
#   * Cartograph reads files; it does not execute them. There is no
#     `Command::new` anywhere in the parser, resolver, pipeline, graph or core
#     crates — the analyser opens files and parses them.
#
# The token therefore never reaches contributor-controlled code.
#
# ## Scopes
#
# `contents: read` and `pull-requests: write`, and nothing else. SECURITY.md
# records "Minimum GitHub scopes" as an M14 invariant. Contents stays read-only:
# this workflow has no reason to write to the repository, and a review that
# could push is a review that could be turned into one.
#
# ## When this first runs
#
# GitHub reads a `pull_request_target` workflow from the **base** branch, not
# from the pull request. So this file does not run on the pull request that
# introduces it -- observed on PR #34, where `ci` ran and this did not -- and
# begins reviewing pull requests once it is on `main`. That is the same property
# that makes the trigger safe, so it is a consequence to record rather than a
# bug to work around: a fork cannot alter the workflow that reviews it.
name: architecture review

on:
  pull_request_target:
    # `synchronize` is what makes the update path real: a second push to the
    # same pull request must update the existing comment, not add another.
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# One review per pull request at a time. Two runs racing would both try to
# upsert the same comment, and the slower one would overwrite the newer review.
concurrency:
  group: architecture-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: architecture review
    runs-on: ubuntu-latest
    steps:
      # 1. The base commit, into the workspace. This is the trusted tree, and
      #    the only one this workflow builds.
      - name: Check out the base commit (trusted; this is what gets built)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: review-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the engine
        run: cargo build --release -p cartograph-cli

      # 2. The two trees to compare, both outside the cargo workspace so that
      #    nothing here can be drawn into a build.
      - name: Check out the base tree to analyse
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trees/base
          persist-credentials: false

      # The head is fetched, not checked out -- see the note at the top. The
      # token is used to download and nothing else; it is never written into
      # the tree. Both values go through `env` rather than being interpolated
      # into the script: a fork's name is contributor-controlled text, and text
      # a contributor controls must never become part of a command.
      - name: Fetch the head tree to analyse (data only — never built)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p trees/head
          gh api "repos/$HEAD_REPO/tarball/$HEAD_SHA" > head.tar.gz
          tar -xzf head.tar.gz -C trees/head --strip-components=1
          rm head.tar.gz

          # An empty tree would diff as "every relationship removed", which is
          # a confident and completely wrong review. Fail instead.
          test -n "$(ls -A trees/head)" || {
            echo "the head archive unpacked to nothing" >&2
            exit 1
          }
          echo "head tree: $(find trees/head -type f | wc -l) files, no .git: $([ -d trees/head/.git ] && echo NO || echo yes)"

      # 3. The binary produces the review. Nothing downstream reformats it.
      - name: Render the architecture review
        run: |
          ./target/release/cartograph diff trees/base trees/head --markdown > review.md
          echo "review is $(wc -c < review.md) bytes"

      # 4. Deliver it. The helper finds Cartograph's own comment by a hidden
      #    marker and updates it, or creates one when absent.
      - name: Post the review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_FILE: review.md
        run: node .github/scripts/review-comment.js
