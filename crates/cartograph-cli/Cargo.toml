[package]
name = "cartograph-cli"
description = "The cartograph command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "cartograph"
path = "src/main.rs"

[dependencies]
cartograph-core.workspace = true
# `cartograph parse` runs the M01 TypeScript extractor.
cartograph-parser.workspace = true
# `cartograph normalize` canonicalises the parser's observations (M03).
cartograph-resolver.workspace = true
# `cartograph match` builds the HttpCall edges an accepted match produces.
cartograph-graph.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
