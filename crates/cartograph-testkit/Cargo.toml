[package]
name = "cartograph-testkit"
description = "Test fixtures and builders for Cartograph. Not published; not a runtime dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
cartograph-core.workspace = true
# Canonical graph equality (M10) compares whole graphs, so the utility needs
# the graph type. Never a runtime dependency: this crate is `publish = false`
# and is only ever used as a dev-dependency.
cartograph-graph.workspace = true
time.workspace = true

[lints]
workspace = true
