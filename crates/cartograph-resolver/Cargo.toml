[package]
name = "cartograph-resolver"
description = "Cross-language resolution: canonical routes, HTTP boundaries, ORM models."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# M03 canonicalises the observations the parser produces, so it consumes the
# parser's fact model directly. No language server yet: async-lsp and lsp-types
# arrive with M04, the milestone that first drives one.
cartograph-parser.workspace = true
# M04 builds the first HttpCall edges, so it needs the domain model's
# Confidence/Provenance/Evidence and the graph they go into.
cartograph-core.workspace = true
cartograph-graph.workspace = true
# Canonical routes serialise for `cartograph normalize --json` and, from M08,
# for golden fixtures compared byte-for-byte in CI.
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
criterion.workspace = true

[[bench]]
name = "matching"
harness = false

[[bench]]
name = "evaluation"
harness = false

[[bench]]
name = "canonicalization"
harness = false

[lints]
workspace = true
