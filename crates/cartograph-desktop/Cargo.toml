[package]
name = "cartograph-desktop"
description = "Repository lifecycle and session model for the Cartograph desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The analysis sequence, shared with the CLI (ADR-0001). This crate orchestrates
# it and holds no analysis of its own.
cartograph-pipeline.workspace = true
# `layout` — the drawing contract the window consumes (ADR-0015).
cartograph-core.workspace = true
cartograph-graph.workspace = true
serde.workspace = true
# M16 Slice 4: the per-repository opt-in table is a small JSON document.
# Promoted from dev-dependencies, so no package is added to the lockfile. The
# frozen stack (§10) names no configuration-format crate, and none is needed.
serde_json.workspace = true

[dev-dependencies]
# Fixed clock, so a composed scene is byte-stable across runs.
cartograph-testkit.workspace = true

[lints]
workspace = true
