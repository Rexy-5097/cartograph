  M09:
    status: ACCEPTED
    accepted: 2026-08-31
    pull_request: 15                        # implementation, merged c578b42
    acceptance_fix_pull_requests: [16]      # merged e8416f9; see acceptance_reason
    provisional_tag: null                   # ADR-0010: none needed
    accepted_tag: cartograph-m09            # immutable
    merge_commit: e8416f936c6c1f909922b5d5185d4347920ddf2c
    acceptance_criterion: PASS
    acceptance_reason: |
      The accepted state is PR #15 plus PR #16, not PR #15 alone. Bringing the
      project onto Windows found a privacy defect in the M09 CLI: `display`
      and `Repository::describe` gated redaction on `Path::is_absolute()`,
      which on Windows requires a drive or UNC prefix. A path rooted on the
      current drive — `\rooted\secret` or `/rooted/secret` — was therefore
      reproduced in full in the serialised `repository.requested` field and in
      the human-readable error, contradicting the v0.1.0 guarantee that no
      absolute filesystem path appears in serialised output. On Unix the two
      predicates are equivalent, so CI never saw it.

      At c578b42 `cargo test --workspace` failed one test on Windows and
      QG-004 failed with it. PR #16 introduced `discovery::is_rooted`
      (`is_absolute() || has_root()`), used at both sites, and six regression
      tests. The analyser was not touched: crates core, graph, parser,
      resolver and testkit are byte-identical to cartograph-m08, and output on
      the pinned full-stack-fastapi corpus is identical apart from timing
      fields. This follows the M07 precedent of folding acceptance fixes into
      the accepted checkpoint rather than tagging a state whose gates fail.
    finding: |
      A first developer-facing release whose supported subset is narrower than
      its ambition, and documented as such. The M09 accuracy figures are M08's
      and are unchanged: confidence remains an uncalibrated prior and 24.9% of
      edges remain unverifiable, so every accuracy number is an upper bound.

      Windows is now a validated development platform: 497 tests, 9/9 gates
      and the full CLI surface pass on x86_64-pc-windows-msvc. It is NOT a
      validated release-artifact platform — see release_artifacts below.
    metrics:
      commands: 6                  # summary, trace, parse, normalize, match, version
      schema_version: "1.0"
      exit_codes_documented: 8     # 0, 2, 3, 4, 5, 6, 7; 1 deliberately unused
      tests: 497
      windows_privacy_forms_verified: 5   # drive, drive-less, forward-slash, UNC, verbatim
    release_artifacts:
      # Built and smoke-tested by CI on every pull request:
      verified: [x86_64-unknown-linux-gnu, aarch64-apple-darwin]
      # Configured in .github/workflows/release.yml but never produced: the
      # workflow runs on tag push and no `v*` tag exists. Not claimed.
      configured_not_produced: [x86_64-apple-darwin, x86_64-pc-windows-msvc]
    accepted_limitations:
      - memory scales with repository size (920 MB on a 32,000-file repository)
      - no incremental analysis, no file watching, no cache between runs (M10)
      - TypeScript, TSX and Python only
      - the supported subset only; anything outside it is refused, not guessed
      - trace walks outward only; no reverse traversal, no blast radius (M12+)
      - node ids are stable within a run, not across runs
      - confidence is not a calibrated probability and must not be thresholded
      - M08's measurement limits carry forward unchanged
      - Windows is validated for development, not for release artifacts
  M10:
    status: ACCEPTED
    accepted: 2026-08-31
    pull_request: 17
    provisional_tag: null                 # ADR-0010: none needed
    accepted_tag: cartograph-m10          # immutable
    merge_commit: 8690ebf0ae4608a7187e7a9503e67b29da0a8b00
    scope_adr: ADR-0014                   # Accepted; governs what M10 delivered
    acceptance_criterion: PASS
    acceptance_reason: |
      The milestone's three acceptance criteria are met: incremental latency
      measured on the benchmark corpus, correctness against full re-analysis,
      and gates pass. Its *scope* line is wider than what shipped, which
      ADR-0014 records rather than leaving unstated.

      Delivered: a parse fact cache keyed by content hash; recorded semantic
      read-dependency tracking through the resolver; per-file Stage C ORM
      access caching with dependency-aware reuse; and failure-safe
      publication. The invariant throughout is
      `incremental_result == clean_rebuild_result`, checked by canonical
      semantic graph equality with the clean rebuild retained as oracle.
    finding: |
      Measurement chose the target rather than intuition. Stage C was 894.8 ms
      of a 950.9 ms cold resolve on zulip (94.1%); cached, a warm resolve is
      60.4 ms. The remaining derived structures were then measured and
      deliberately NOT cached - ExportedConstants 1.8 ms, ModuleIndex 0.29 ms,
      RouteIndex 0.032 ms, RouterIndex 0.005 ms - because caching them buys
      machinery and not benefit.

      The claim is work avoided, not milliseconds: 1,067 hits / 0 misses on an
      unchanged tree. A warm run now spends 318.7 ms of 379 ms (84%) in
      filesystem walk, read and hash, which is the floor of any
      content-addressed design and is only escapable with file watching.
    metrics:
      tests: 622
      differential_tests: 23
      access_cache_tests: 12
      atomicity_tests: 7
      dependency_tests: 56
      m09_resolver_suites_unchanged: 11
      stage_c_cold_ms: 894.8
      stage_c_warm_ms: 4.34
      resolve_cold_ms: 950.9
      resolve_warm_ms: 60.4
      zulip_mutations: 14
      airflow_mutations: 7
    deferred:                      # ADR-0014 - NOT delivered, and not claimed
      - content-hash node identity   # id.rs byte-identical to cartograph-m09
      - notify file watching         # no `notify` dependency exists
      - local graph database         # ROADMAP 0.2; no `redb` dependency exists
      - broader global-index caching # measured, then deliberately declined
    superseded:
      - "<250 ms per change"       # never adopted as a criterion; correctness came first
    accepted_limitations:
      - both caches are process-local, so the CLI cannot benefit across invocations
      - DefaultHasher is an internal invalidation identity, unsuitable on disk
      - failure atomicity is proven at one injected boundary, not for arbitrary internal failure
      - model-set invalidation is coarse by construction; the model set is global
      - airflow's subtree holds 13 Python files and zulip has no build aliases, so neither exercises both mechanisms at full scale
      - stable cross-run node identity does not exist; M13 requires it (ADR-0014)
  M11:
    status: ACCEPTED
    accepted: 2026-09-01
    pull_request: [18, 19, 21, 22, 23]     # four slices plus the version prerequisite
    provisional_tag: null                  # ADR-0010: none needed
    accepted_tag: cartograph-m11           # immutable
    merge_commit: 17f114ee19c467261a89c012f8b77824b71affd2
    implementation: MERGED
    scope_adrs: [ADR-0015, ADR-0016, ADR-0017]
    acceptance_criterion: PASS
    acceptance_reason: |
      Both stated criteria are met, and the gates pass.

      MAP answers "what is this system?" - judged PASS by the project owner on
      Apache Airflow at 9b43d6abc0fc: 3,104 nodes, 3,350 edges, 313 clusters.
      The cross-stack claim the product exists to make is visible there - 175
      HttpCall edges from TypeScript in ui/openapi-gen into FastAPI handlers,
      60 tables reached through 60 Queries edges, and clusters named after the
      real architecture (api_fastapi/core_api/routes/public, airflow/models,
      ui/openapi-gen/queries).

      10,000 nodes at 60 FPS - measured over six foregrounded runs of the real
      Tauri window on the deterministic 10,000-node / 11,444-edge / 115-cluster
      fixture. Median 6.70-10.00 ms and p95 11.10-14.30 ms, both inside the
      16.67 ms budget in every run.
    finding: |
      The desktop is a second client of the same core, not a second
      implementation. Layout is computed in Rust and copied to the renderer
      without arithmetic; Sigma draws and computes nothing. The evidence record
      is a lookup rather than part of the render payload, so ten thousand nodes
      do not carry data nothing draws.

      The map is only as rich as the resolver's coverage. Airflow shows the
      full cross-stack story; zulip and full-stack-fastapi do not, for reasons
      recorded under accepted_limitations. That is inherited M07/M08 coverage,
      not a rendering defect - the same desktop draws all three faithfully.
    metrics:
      tests: 690
      frontend_tests: 43
      benchmark_nodes: 10000
      benchmark_edges: 11444
      benchmark_clusters: 115
      benchmark_runs: 6
      median_frame_ms: "6.70-10.00"
      p95_frame_ms: "11.10-14.30"
      worst_frame_ms: "31.50-46.80"
      frames_over_budget_pct: "0.08-1.41"
      airflow_nodes: 3104
      airflow_edges: 3350
      airflow_clusters: 313
      zulip_nodes: 1308
      zulip_edges: 1469
      fsfa_nodes: 2
    map_evidence:
      airflow:   {commit: 9b43d6abc0fc, nodes: 3104, edges: 3350, clusters: 313, judgement: PASS}
      zulip:     {commit: 0ce8f6278cde, nodes: 1308, edges: 1469, clusters: 32,  judgement: THIN}
      fastapi:   {commit: 162344da111e, nodes: 2,    edges: 1,    clusters: 2,   judgement: THIN}
    accepted_limitations:
      - worst frames of 31-47 ms occur, roughly 1 in 100, and are visible stutter
      - the 10k measurement is a debug build on one machine with a 165 Hz display
      - zulip produces a thin map - 0 routes, 1 table, 11 HttpCall edges, most of them test utilities - because it registers URLs through rest_path(...), which the resolver does not recognise
      - full-stack-fastapi produces 2 nodes; its M09 "23 routes" were observations that never became matched edges
      - both thin results are resolver coverage inherited from M07/M08, not desktop rendering
      - the Windows MSI bundle cannot be produced - tauri.conf.json lists only icons/icon.png while the bundler requires a .ico, which exists but is not declared
      - the desktop shell is outside `cargo test --workspace` and is covered by a dedicated CI job (ADR-0016)
      - no stable cross-run node identity; M13 requires it (ADR-0014)
