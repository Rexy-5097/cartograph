  M08:
    status: ACCEPTED
    accepted: 2026-08-22
    pull_request: 14
    provisional_tag: null                 # ADR-0010: none needed
    accepted_tag: cartograph-m08          # immutable
    merge_commit: 9dbb38ecf180ae82102dd49949c584c1f69794a9
    product_change: none                  # analyser byte-identical to cartograph-m07
    finding: |
      Confidence is an uncalibrated prior selected by evidence class, not a
      probability: seven distinct values across 14,932 edges, 79% at exactly
      0.80. Measured ECE 0.1819 development / 0.1825 holdout and MCE 0.35, all
      in the direction of UNDER-confidence. Overconfidence could not be
      measured at all: the low-confidence bands have zero verified
      observations.

      These measurements are bounded by the independently verifiable subset
      and should not be interpreted as corpus-wide accuracy.
    metrics:
      edges_labelled: 14932
      verified: 11221
      unverifiable: 3711                  # 24.9%, concentrated where evidence is weakest
      false_positives: 1                  # deliberately recorded, not fixed
      ece_development: 0.1819
      ece_holdout: 0.1825
      mce: 0.35
      http_call_recall: "117/129"         # generated-client scope
      orm_access_recall: "1401/1883"      # import-bound scope
      chain_recall: "3 of 5"              # denominator too small for a rate
      integrity_checks: "16/16"
      adversarial_attacks_detected: "14/14 pipeline, 8/8 gate"
      production_thresholds_changed: none
    accepted_limitations:
      - 24.9% of edges are unverifiable from source, and not a random quarter
      - low-confidence bands (0.64, 0.72, 0.784) have zero verified observations
      - overconfidence is therefore unmeasured
      - the chain-recall denominator is five
      - one false positive remains, deliberately recorded
      - recall is scope-specific, not corpus-wide
