# Machine-readable project state. Human twin: ../context/state.md
# RULE: this file may not claim a gate PASS unless the gate actually ran and passed.
project: cartograph
spec_version: V3
spec_frozen: 2026-08

current_milestone: M11
status: ACCEPTED                # M11 accepted 2026-09-01; see milestones.M11
current_branch: main
next_allowed_milestone: M12    # UNLOCKED - M11 accepted; M13 locked until M12 is accepted
# `current_milestone` names the milestone this tree implements, and
# `cartograph_cli::version::MILESTONE` is asserted equal to it by a unit test
# (crates/cartograph-cli/src/version.rs). The two must always move together,
# in a pull request, because the constant is product code.
#
# It reads M11 and stays there through M11's acceptance. Setting it to M12
# would be wrong twice over: no M12 code exists, so the tree does not
# implement M12; and the constant still reads "M11", so advancing this field
# alone fails QG-004. A bookkeeping commit may not touch the constant.
#
# M12 is unlocked by `next_allowed_milestone` and by its own NOT_STARTED
# entry, exactly as M11 was unlocked at M10's acceptance. The pair advances in
# the first M12 pull request.

